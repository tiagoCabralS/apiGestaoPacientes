<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cadastro de Paciente</h2>
    <form action="http://localhost:3000/paciente/" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento">
        <label for="genero">Gênero:</label>
        <input type="text" id="genero" name="genero">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf">
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone">
        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email">
        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep">
        <label for="rua">Rua:</label>
        <input type="text" id="rua" name="rua">
        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero">
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade">
        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado">
        <label for="tipoSanguineo">Tipo Sanguíneo:</label>
        <input type="text" id="tipoSanguineo" name="tipoSanguineo">
        <label for="alergias">Alergias:</label>
        <input type="text" id="alergias" name="alergias">
        <label for="comorbidades">Comorbidades:</label>
        <input type="text" id="comorbidades" name="comorbidades">
        <label for="peso">Peso (Kg):</label>
        <input type="text" id="peso" name="peso">
        <label for="altura">Altura (cm):</label>
        <input type="text" id="altura" name="altura">
        <button type="submit">Enviar</button>
    </form>
